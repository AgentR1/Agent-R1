repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.6"
    hooks:
      - id: ruff
        args: ["--fix", "--show-fixes", "--output-format=full"]
        exclude: ^.*\.(ipynb)$|^recipe/
      - id: ruff-format
  
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.3.1'
    hooks:
      - id: mypy